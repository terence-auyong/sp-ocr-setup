version: 1
backend:
  phases:
    build:
      commands:
        - corepack enable
        - pnpm install --no-frozen-lockfile
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install --no-frozen-lockfile
    build:
      commands:
        - export GENERATE_SOURCEMAP=false
        - export NODE_OPTIONS="--max-old-space-size=4096"
        - pnpm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*